<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="{{SUBTITLE}}">
<title>{{TITLE}}</title>
<link rel="icon" href="{{ICON}}">
<style>{{CSS}}</style>
</head>
<body>
<div class="app" id="app">
<header class="top"><div class="brand"><img src="{{ICON}}" alt=""><div><strong>Cloud Native Lima</strong><span>{{SUBTITLE}}</span></div></div><div class="tools"><button class="tool" id="notes">Notas y fuentes</button><button class="tool" id="overview" aria-pressed="false">Ver todas</button><button class="tool" id="fullscreen">Pantalla completa</button><button class="tool" id="print">PDF / Imprimir</button></div></header>
<main class="stage" id="deck" aria-label="{{SUBTITLE}}">{{SLIDES}}</main>
<footer class="controls" aria-label="Controles de presentación"><label class="sr" for="jump">Ir a diapositiva</label><select id="jump"></select><div class="progress" role="progressbar" aria-label="Avance de presentación" aria-valuemin="1" aria-valuemax="{{COUNT}}" aria-valuenow="1"><div id="bar"></div></div><span id="counter">01 / {{COUNT}}</span><div class="nav-buttons"><button id="prev" aria-label="Diapositiva anterior">←</button><button id="next" aria-label="Diapositiva siguiente">→</button></div></footer>
<p class="sr" aria-live="polite" id="announce"></p>
</div>
<script>
(()=>{'use strict';const slides=[...document.querySelectorAll('.slide')],app=document.getElementById('app'),jump=document.getElementById('jump'),overview=document.getElementById('overview'),prev=document.getElementById('prev'),next=document.getElementById('next'),full=document.getElementById('fullscreen');let index=0,all=false;
slides.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=String(i+1).padStart(2,'0')+' / '+s.dataset.title;jump.append(o);s.setAttribute('role','group');s.setAttribute('aria-roledescription','diapositiva');});
function fromHash(){const m=location.hash.match(/^#slide-(\d+)$/);return m?Math.max(0,Math.min(slides.length-1,Number(m[1])-1)):0;}
function show(n,write=true){index=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>{s.hidden=!all&&i!==index;});jump.value=index;prev.disabled=index===0;next.disabled=index===slides.length-1;document.getElementById('counter').textContent=String(index+1).padStart(2,'0')+' / '+slides.length;document.getElementById('bar').style.width=((index+1)/slides.length*100)+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',index+1);document.getElementById('announce').textContent='Diapositiva '+(index+1)+' de '+slides.length+': '+slides[index].dataset.title;if(write){try{history.replaceState(null,'','#slide-'+(index+1));}catch{location.hash='slide-'+(index+1);}}if(all&&write)slides[index].scrollIntoView({block:'start',behavior:'auto'});else if(write)window.scrollTo({top:0,behavior:'auto'});}
prev.addEventListener('click',()=>show(index-1));next.addEventListener('click',()=>show(index+1));jump.addEventListener('change',()=>show(Number(jump.value)));
overview.addEventListener('click',()=>{all=!all;app.classList.toggle('overview',all);overview.setAttribute('aria-pressed',all);overview.textContent=all?'Presentar':'Ver todas';show(index);});
document.getElementById('print').addEventListener('click',()=>window.print());
full.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{document.getElementById('announce').textContent='Este navegador no permite pantalla completa. Puedes usar su menú de visualización.';full.textContent='No disponible';}});
if(!document.fullscreenEnabled)full.hidden=true;document.addEventListener('fullscreenchange',()=>{full.textContent=document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa';});
document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||e.altKey||e.ctrlKey||e.metaKey||/INPUT|TEXTAREA|SELECT|BUTTON|A/.test(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(index+1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1);}if(e.key==='Home'){e.preventDefault();show(0);}if(e.key==='End'){e.preventDefault();show(slides.length-1);}});
window.addEventListener('hashchange',()=>show(fromHash(),false));show(fromHash(),false);
})();
</script>
<dialog id="notesDialog" aria-label="Notas y fuentes"><button id="closeNotes">Cerrar</button><div id="notesContent" class="dialog-heading"></div></dialog>
<script>document.getElementById('notes').addEventListener('click',()=>{const i=Number(document.getElementById('jump').value);document.getElementById('notesContent').innerHTML=document.querySelectorAll('.speaker-note')[i].innerHTML;document.getElementById('notesDialog').showModal();});document.getElementById('closeNotes').addEventListener('click',()=>document.getElementById('notesDialog').close());document.getElementById('notesDialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});</script></body></html>
